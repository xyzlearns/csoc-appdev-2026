version: "2.4"

services:
  mongodb:
    image: mongo:7
    container_name: fooddelivery-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ./fooddeliverybackend
    container_name: fooddelivery-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/fooddelivery?serverSelectionTimeoutMS=60000
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  mongodb_data:
